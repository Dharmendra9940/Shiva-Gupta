<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>S6 Application</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
/* ============================================================
   THEME
   ============================================================ */
:root{
  --gold:#15bc58;
  --gold-2:#e0a020;
  --glass:rgba(255,255,255,.12);
  --glass-b:rgba(255,255,255,.26);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  background:#000;color:#fff;overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}

/* ============================================================
   SCREEN / LAYOUT
   ============================================================ */
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  display:flex;flex-direction:column;
  animation:fadeIn .35s ease;
}
@keyframes fadeIn{from{opacity:0;transform:scale(1.01)}to{opacity:1;transform:none}}
.veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.74) 100%)}
.content{position:relative;z-index:2;display:flex;flex-direction:column;
  min-height:100%;width:100%;max-width:1150px;margin:0 auto;padding:14px 14px 0}
.center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0;width:100%}

/* ---------- header ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.head-left{display:flex;align-items:center;gap:10px;min-width:0}
.page-title{
  margin:0;font-size:1.15rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff,#f6d365);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.back-btn{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;border:1px solid var(--glass-b);
  background:var(--glass);color:#fff;font-size:1.1rem;line-height:1;cursor:pointer;transition:.2s;
}
.back-btn:hover{background:rgba(255,255,255,.24);transform:translateX(-2px)}
.user-badge{
  font-size:.66rem;font-weight:800;letter-spacing:1px;padding:6px 11px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid var(--glass-b);white-space:nowrap;
}
.user-badge.admin{background:linear-gradient(135deg,#f6d365,#e0a020);color:#2a1a00;border-color:#f6d365}

/* ============================================================
   CARDS
   ============================================================ */
.card-glass{
  background:rgba(16,14,12,.76);
  border:1px solid rgba(255,255,255,.16);
  border-radius:20px;
  padding:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 22px 55px rgba(0,0,0,.55);
  margin-bottom:16px;
  width:100%;
}
.login-card{max-width:430px;margin:0 auto;text-align:center}

/* ---------- Ganesh / mandala ---------- */
.mandala{
  width:104px;height:104px;margin:0 auto 10px;border-radius:50%;
  display:grid;place-items:center;font-size:2.9rem;line-height:1;
  background:radial-gradient(circle,rgba(255,220,130,.35),transparent 72%);
  border:2px solid rgba(255,215,120,.6);
  animation:pulse 3.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 28px rgba(255,190,80,.45),inset 0 0 20px rgba(255,190,80,.3)}
  50%{box-shadow:0 0 62px rgba(255,190,80,.85),inset 0 0 34px rgba(255,190,80,.55)}
}
.deity-name{font-size:.8rem;letter-spacing:2px;color:#ffe4a8;margin-bottom:6px}
.login-title{margin:6px 0 18px;font-size:1.5rem;font-weight:800;letter-spacing:3px;text-transform:uppercase}

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field.full{grid-column:1/-1}
.field label{font-size:.72rem;letter-spacing:.9px;text-transform:uppercase;color:#f0d9a8;font-weight:700}
.inp{
  width:100%;padding:11px 13px;border-radius:12px;font-size:.95rem;color:#fff;outline:none;
  border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.10);
  transition:.18s;font-family:inherit;
}
.inp:focus{border-color:var(--gold);background:rgba(255,255,255,.17);
  box-shadow:0 0 0 3px rgba(240,193,75,.22)}
.inp::placeholder{color:rgba(255,255,255,.42)}
select.inp{appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%23f0c14b'><path d='M7 10L2 4h10z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
select.inp option{color:#111;background:#fff}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn-x{
  border:none;border-radius:13px;padding:12px 22px;font-weight:800;font-size:.9rem;
  letter-spacing:.6px;cursor:pointer;transition:.18s;font-family:inherit;
}
.btn-gold{background:linear-gradient(135deg,#f6d365,#e0a020);color:#2a1a00;
  box-shadow:0 9px 22px rgba(224,160,32,.34)}
.btn-gold:hover{filter:brightness(1.09);transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--glass-b)}
.btn-ghost:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}
.btn-x:active{transform:scale(.97)}
.btn-x:disabled,.btn-x.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.7);transform:none!important}
.btn-block{width:100%;margin-top:6px}
.btn-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ============================================================
   TILE GRID (menu pages)
   ============================================================ */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;width:100%}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:20px 12px;border-radius:18px;cursor:pointer;color:#fff;font-family:inherit;
  background:rgba(255,255,255,.11);border:1px solid var(--glass-b);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .16s,background .22s,box-shadow .22s;
}
.tile:hover{transform:translateY(-4px);background:rgba(255,255,255,.22);
  box-shadow:0 14px 32px rgba(0,0,0,.45);border-color:rgba(240,193,75,.6)}
.tile:active{transform:scale(.97)}
.tile-ico{font-size:1.65rem;line-height:1}
.tile-lbl{font-size:.82rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;text-align:center}
.tile.disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.75)}
.tile.disabled:hover{transform:none;background:rgba(255,255,255,.11);box-shadow:none}

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap{margin-top:4px}
.table-scroll{overflow-x:auto;border-radius:14px;border:1px solid rgba(255,255,255,.15);
  -webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem;min-width:480px}
.tbl th{background:rgba(240,193,75,.20);color:#ffe9b0;text-align:left;padding:10px 12px;
  white-space:nowrap;font-weight:800;letter-spacing:.5px;font-size:.72rem;text-transform:uppercase}
.tbl td{padding:9px 12px;border-top:1px solid rgba(255,255,255,.09);white-space:nowrap}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:rgba(255,255,255,.09);cursor:pointer}
.empty{padding:22px;text-align:center;color:rgba(255,255,255,.55);font-size:.85rem;
  border:1px dashed rgba(255,255,255,.2);border-radius:14px}

/* ============================================================
   FOOTER
   ============================================================ */
.footer{
  margin-top:auto;padding:22px 8px 14px;text-align:center;
  font-size:.74rem;letter-spacing:.8px;color:rgba(255,255,255,.62);
}
.footer b{color:var(--gold);font-weight:700}

/* ---------- admin password panel ---------- */
.pw-panel{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);text-align:left}
.pw-panel.on{display:block}
.pw-link{background:none;border:none;color:#ffd97a;font-size:.74rem;letter-spacing:.8px;
  text-decoration:underline;cursor:pointer;margin-top:12px;font-family:inherit}

/* ============================================================
   BACKGROUND ART  (pure CSS — replace with photos via BG{})
   ============================================================ */
.bg-ganesh{background-color:#2b0700;background-image:
  repeating-conic-gradient(from 0deg at 50% 42%,
     rgba(255,220,140,.10) 0deg 5deg, rgba(0,0,0,0) 5deg 10deg),
  radial-gradient(circle at 50% 40%, rgba(255,236,170,.55), rgba(255,150,40,.25) 36%, transparent 64%),
  radial-gradient(circle at 50% 118%, #ff8a00 0%, transparent 56%),
  linear-gradient(165deg,#2b0700 0%,#7a1e00 40%,#c25a00 74%,#f0a13a 100%);}

.bg-plains{background-color:#4b8b2b;background-image:
  repeating-linear-gradient(100deg, rgba(255,255,255,.055) 0 3px, transparent 3px 15px),
  linear-gradient(180deg,#8fd3f4 0%,#d9f0a3 34%,#8cc152 56%,#4b8b2b 100%);}

.bg-dallake{background-color:#0a2f42;background-image:
  linear-gradient(180deg,#0a2a3d 0%,#155e7a 26%,#57b0cc 49%,#1d6a86 52%,#0a2f42 100%);}
.bg-dallake::before{content:'';position:absolute;left:0;right:0;top:26%;height:26%;z-index:0;
  background:linear-gradient(180deg,#1b4a63,#0d2c3e);opacity:.92;
  clip-path:polygon(0 100%,0 62%,9% 38%,17% 58%,26% 22%,36% 54%,45% 30%,56% 60%,66% 32%,76% 62%,86% 40%,94% 64%,100% 46%,100% 100%);}
.bg-dallake::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;z-index:0;opacity:.8;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.13) 0 2px,rgba(255,255,255,0) 2px 17px),
             linear-gradient(180deg,#12556e,#062432);}

.bg-agrafort{background-color:#7a2b06;background-image:
  linear-gradient(180deg,#ffd89b 0%,#f7b267 32%,#c1440e 72%,#7a2b06 100%);}
.bg-agrafort::before{content:'';position:absolute;left:0;right:0;bottom:0;height:52%;z-index:0;
  background:linear-gradient(180deg,#a63c0a,#6b2505);opacity:.95;
  clip-path:polygon(0 100%,0 56%,8% 56%,8% 30%,14% 30%,14% 56%,26% 56%,26% 20%,32% 8%,38% 20%,38% 56%,50% 56%,50% 32%,56% 32%,56% 56%,68% 56%,68% 18%,74% 6%,80% 18%,80% 56%,92% 56%,92% 34%,100% 34%,100% 100%);}

.bg-haunted{background-color:#0b0f14;background-image:
  radial-gradient(circle at 78% 14%, rgba(180,200,255,.22), transparent 42%),
  linear-gradient(180deg,#0b0f14 0%,#1a2028 42%,#2b2f2a 72%,#0a0d0a 100%);}
.bg-haunted::before{content:'';position:absolute;left:0;right:0;bottom:0;height:56%;z-index:0;opacity:.9;
  background:#05070a;
  clip-path:polygon(0 100%,0 60%,6% 60%,6% 40%,10% 20%,14% 40%,14% 60%,22% 60%,22% 48%,26% 32%,30% 48%,30% 60%,40% 60%,40% 44%,45% 28%,50% 44%,50% 60%,60% 60%,60% 50%,64% 34%,68% 50%,68% 60%,78% 60%,78% 42%,82% 26%,86% 42%,86% 60%,94% 60%,94% 50%,100% 50%,100% 100%);}

.bg-forest{background-color:#0a2410;background-image:
  radial-gradient(circle at 72% 8%, rgba(255,240,150,.32), transparent 46%),
  repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 10px, rgba(0,0,0,0) 10px 44px),
  linear-gradient(180deg,#0d2b12 0%,#1c5c2a 46%,#0a2410 100%);}

.bg-humayun{background-color:#b98a5a;background-image:
  linear-gradient(180deg,#2e6f9e 0%,#8ec6e8 34%,#e8d9b8 60%,#b98a5a 100%);}
.bg-humayun::before{content:'';position:absolute;left:0;right:0;bottom:0;height:48%;z-index:0;
  background:linear-gradient(180deg,#f4e8d2,#c8a97a);opacity:.96;
  clip-path:polygon(0 100%,0 62%,10% 62%,10% 42%,20% 42%,20% 62%,30% 62%,30% 22%,34% 12%,38% 5%,42% 12%,46% 22%,46% 62%,58% 62%,58% 42%,68% 42%,68% 62%,78% 62%,78% 46%,88% 46%,88% 62%,100% 62%,100% 100%);}

.bg-library{background-color:#2a1a10;background-image:
  repeating-linear-gradient(180deg, rgba(255,255,255,.10) 0 2px, rgba(0,0,0,0) 2px 54px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 7px, rgba(0,0,0,0) 7px 26px),
  linear-gradient(180deg,#3a2416 0%,#5a3a22 46%,#2a1a10 100%);}

.bg-horror{background-color:#050203;background-image:
  radial-gradient(circle at 50% 26%, rgba(150,0,0,.38), transparent 58%),
  radial-gradient(circle at 12% 82%, rgba(255,255,255,.07), transparent 40%),
  linear-gradient(180deg,#0a0507 0%,#1c0a10 52%,#050203 100%);}

.bg-beachfort{background-color:#0e5a7a;background-image:
  linear-gradient(180deg,#87ceeb 0%,#ffd9a0 38%,#e8c07a 54%,#2f9ec4 55%,#0e5a7a 100%);}
.bg-beachfort::before{content:'';position:absolute;left:0;right:0;bottom:44%;height:26%;z-index:0;
  background:linear-gradient(180deg,#8a5a34,#5d3a1e);opacity:.95;
  clip-path:polygon(0 100%,0 44%,7% 44%,7% 22%,12% 22%,12% 44%,22% 44%,22% 12%,26% 4%,30% 12%,30% 44%,42% 44%,42% 26%,48% 26%,48% 44%,60% 44%,60% 10%,65% 2%,70% 10%,70% 44%,82% 44%,82% 26%,90% 26%,90% 44%,100% 44%,100% 100%);}

.bg-desert{background-color:#b9742a;background-image:
  linear-gradient(180deg,#ffe3a3 0%,#f7b955 36%,#e09b3d 62%,#b9742a 100%);}
.bg-desert::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;z-index:0;
  background:linear-gradient(180deg,#e8a94a,#c07a24);opacity:.95;
  clip-path:polygon(0 100%,0 70%,20% 44%,40% 70%,60% 40%,80% 66%,100% 44%,100% 100%);}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:600px){
  .content{padding:11px 11px 0}
  .tile-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{padding:16px 8px;border-radius:15px}
  .tile-ico{font-size:1.4rem}
  .tile-lbl{font-size:.72rem;letter-spacing:.4px}
  .page-title{font-size:.94rem;letter-spacing:.9px}
  .card-glass{padding:14px;border-radius:17px}
  .form-grid{grid-template-columns:1fr}
  .btn-x{padding:11px 16px;font-size:.84rem;flex:1 1 auto}
  .btn-bar{gap:8px}
  .mandala{width:86px;height:86px;font-size:2.3rem}
  .login-title{font-size:1.25rem}
}
@media (max-width:360px){ .tile-grid{grid-template-columns:1fr} }

@media print{
  .veil,.page-head,.btn-bar,.footer,.back-btn,.user-badge{display:none!important}
  body{background:#fff;color:#000}
  .screen{position:static;background:#fff!important;overflow:visible}
  .card-glass{box-shadow:none;border:1px solid #999;background:#fff;color:#000;backdrop-filter:none}
  .tbl th{background:#eee;color:#000}
  .tbl td{color:#000;border-top:1px solid #ccc}
  .inp{color:#000;background:#fff;border:1px solid #999}
}
</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ==================================================================
   S6 APPLICATION — single file, vanilla JS
   ------------------------------------------------------------------
   ▸ Put your own photo URLs in BG{} below to get exact backgrounds.
     Leave them empty ('') to use the built-in CSS artwork.
   ================================================================== */
const BG = {
  ganesh   : '',   // Lord Ganesh
  plains   : '',   // Northern Plains
  dallake  : '',   // Dal Lake (meditation)
  agrafort : '',   // Agra Fort
  haunted  : '',   // Haunted Village
  forest   : '',   // Forest
  humayun  : '',   // Humayun's Tomb
  library  : '',   // Library
  horror   : '',   // Horror place of India
  beachfort: '',   // Fort on the beach
  desert   : ''    // Sahara Desert
};

/* ==================================================================
   1. STORAGE
   ================================================================== */
const KEY = 's6_';
function load(k, d){
  try{ const v = JSON.parse(localStorage.getItem(KEY+k)); return (v===null||v===undefined)?d:v; }
  catch(e){ return d; }
}
function save(k, v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} }

const db = {
  items     : load('items', []),
  suppliers : load('suppliers', []),
  clients   : load('clients', []),
  expenses  : load('expenses', []),
  received  : load('received', []),
  salesmen  : load('salesmen', []),
  bills     : load('bills', []),
  payments  : load('payments', []),
  receipts  : load('receipts', []),
  discounts : load('discounts', []),
  logins    : load('logins', []),
  hold      : load('hold', [])
};
function persist(k){ save(k, db[k]); }

const state = { user:null, isAdmin:false, tries:0 };
let formState = {};

/* ==================================================================
   2. CONSTANTS & HELPERS
   ================================================================== */
const GROUPS         = ['General','Fancy','Kids','Ladies','Gents','Sports','Electronics','Stationery','Grocery'];
const EXPENSE_GROUPS = ['Rent','Salary','Electricity','Transport','Packing','Marketing','Misc'];
const PAYMODES       = ['Cash','Card','Cheque'];
const OCCASIONS      = ['Birthday','Anniversary'];

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function today(){ return new Date().toISOString().slice(0,10); }
function money(n){ return '\u20B9' + num(n).toFixed(2); }
function inRange(d, from, to){
  if(!d) return true;
  if(from && d < from) return false;
  if(to   && d > to)   return false;
  return true;
}
function isBlank(v){
  return Object.keys(v||{}).every(k => !String(v[k]==null?'':v[k]).trim());
}
function uniq(a){ return [...new Set(a.filter(Boolean))]; }
function uid(){ return 'r' + Date.now() + Math.floor(Math.random()*9999); }

/* ==================================================================
   3. APPLICATION EXIT  (silent)
   ================================================================== */
function exitApp(){
  try{ window.open('', '_self'); window.close(); }catch(e){}
  document.getElementById('app').innerHTML = '';
  document.body.style.background = '#000';
  setTimeout(function(){ try{ location.replace('about:blank'); }catch(e){} }, 60);
}

/* ==================================================================
   4. LOGIN  (Admin + Operators, 2 chances)
   ================================================================== */
function adminPassword(){ return load('adminpass', 'admin'); }

function validateLogin(u, p){
  if(u.toLowerCase() === 'admin') return p === adminPassword();
  const usr = db.logins.find(x => (x.username||'').toLowerCase() === u.toLowerCase());
  if(usr) return usr.password === p;
  return true;                     // any other name -> Operator
}

function onLogin(ev){
  ev.preventDefault();
  const u = document.getElementById('luser').value.trim();
  const p = document.getElementById('lpass').value;

  if(u && p && validateLogin(u, p)){
    state.user    = u;
    state.isAdmin = (u.toLowerCase() === 'admin');
    state.tries   = 0;
    go('s6');
    return;
  }

  state.tries++;
  if(state.tries >= 2){
    exitApp();                     // 2nd wrong attempt -> silent exit
  }else{
    alert('Wrong Password');       // 1st wrong attempt -> message box
    const f = document.getElementById('lpass');
    if(f){ f.value = ''; f.focus(); }
  }
}

/* ---- Admin password set / change (Welcome page only) ---- */
function togglePwPanel(){
  const p = document.getElementById('pwPanel');
  if(p) p.classList.toggle('on');
}
function saveAdminPassword(){
  const oldP = document.getElementById('pwOld').value;
  const newP = document.getElementById('pwNew').value;
  const reP  = document.getElementById('pwRe').value;

  if(oldP !== adminPassword()){ alert('Wrong Password'); return; }
  if(!newP || newP !== reP){ alert('Wrong Password'); return; }
  save('adminpass', newP);
  document.getElementById('pwOld').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwRe').value  = '';
  togglePwPanel();
  alert('Password Changed');
}

/* ==================================================================
   5. SCREEN SHELL
   ================================================================== */
function mount(s){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(s);
}

function screenShell(bg, title, parent){
  const s = el('div', 'screen bg-' + (bg || 'plains'));
  if(BG[bg]) s.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.70)), url("' + BG[bg] + '")';
  s.appendChild(el('div', 'veil'));

  const c = el('div', 'content');
  s.appendChild(c);
  s._content = c;

  if(title){
    const h = el('div', 'page-head');
    const left = el('div', 'head-left');
    if(parent){
      const b = el('button', 'back-btn', '&#8592;');
      b.type = 'button';
      b.setAttribute('aria-label','Back');
      b.onclick = function(){ go(parent); };
      left.appendChild(b);
    }
    left.appendChild(el('h1', 'page-title', esc(title)));
    h.appendChild(left);
    h.appendChild(el('span', 'user-badge' + (state.isAdmin ? ' admin' : ''),
      state.isAdmin ? 'ADMIN' : (state.user || 'OPERATOR')));
    c.appendChild(h);
  }
  return s;
}

function footer(){
  return el('div', 'footer',

    '<div class="deity-name">&#2405; &#2358;&#2381;&#2352;&#2368; &#2327;&#2339;&#2375;&#2358;&#2366;&#2351; &#2344;&#2350;&#2307; &#2405;</div>' +

        '<label for="luser">User Name</label>' +

      '</div>' +
      '<div class="field" style="margin-bottom:16px">' +
        '<label for="lpass">Password</label>' +
        '<input class="inp" id="lpass" type="password" autocomplete="current-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022">' +

      '<div class="field" style="margin-bottom:10px"><label>Current Password</label>' +
        '<input class="inp" id="pwOld" type="password" placeholder="current"></div>' +
      '<div class="field" style="margin-bottom:10px"><label>New Password</label>' +

  wrap.appendChild(card);
  c.appendChild(wrap);
  c.appendChild(footer());

  card.querySelector('#loginForm').addEventListener('submit', onLogin);
  card.querySelector('#pwToggle').addEventListener('click', togglePwPanel);

  mount(s);

/* ==================================================================
   8. OPTION SOURCES
   ================================================================== */
function sourceOptions(src){
  switch(src){
    case 'groups'    : return GROUPS.map(g => ({v:g, l:g}));
    case 'expgroups' : return EXPENSE_GROUPS.map(g => ({v:g, l:g}));
    case 'paymodes'  : return PAYMODES.map(g => ({v:g, l:g}));
    case 'occasions' : return OCCASIONS.map(g => ({v:g, l:g}));
    case 'companies' : return uniq(db.items.map(i => i.company)).map(c => ({v:c, l:c}));
    case 'styles'    : return uniq(db.items.map(i => i.style)).map(c => ({v:c, l:c}));
    case 'items'     : return db.items.map(i => ({v:i.barcode, l:(i.barcode||'') + ' \u00B7 ' + (i.itemName||'')}));
    case 'suppliers' : return db.suppliers.map(s => ({v:s.supName, l:s.supName}));
    case 'clients'   : return db.clients.map(s => ({v:s.clientName, l:s.clientName}));
    case 'salesmen'  : return db.salesmen.map(s => ({v:s.smName, l:s.smName}));
    default          : return [];
  }
}

FORMS['group-discount'] = {

  ],
  buttons:[B.save, B.modify, B.exit],
  table:{
    auto:true,
    cols:[{k:'group',l:'Group Name'},{k:'company',l:'Company'},{k:'discRate',l:'Discount Rate'}],
    rows:function(){ return db.discounts; }
  },
  act:function(action, v, def){
    if(action === 'modify'){
      const i = db.discounts.findIndex(d => d.group === v.group && d.company === v.company);
      const rec = { group:v.group, company:v.company, discRate:v.discRate };
      if(i >= 0){ rec._id = db.discounts[i]._id; db.discounts[i] = rec; }
      else db.discounts.push(rec);
      persist('discounts');
      go(def.id);
      return true;
    }
    return false;
  }
};

    rows:function(v){
      const out = {};
      db.items
        .filter(i => (!v.group || i.group === v.group) &&
                     (!v.company || i.company === v.company) &&
                     (!v.style || String(i.style||'').toLowerCase().includes(v.style.toLowerCase())))
        .forEach(i => {
          const g = i.group || 'General';
          if(!out[g]) out[g] = { group:g, prate:0, qty:0 };
          out[g].prate += num(i.prate);
          out[g].qty   += num(i.pqty);
        });
      return Object.values(out);
    }
  }
};

FORMS['supplier-ledger'] = {
  title:'Supplier Ledger', parent:'supplier', bg:'agrafort',
  rerender:true,
  fields:[
    { n:'supplier', l:'Supplier',  t:'select', src:'suppliers', all:true },
    { n:'from',     l:'From Dt.',  t:'date' },
    { n:'to',       l:'To Dt.',    t:'date' }
  ],
  buttons:[B.exit],
  table:{
    auto:true,
    cols:[{k:'description',l:'Description'},{k:'debit',l:'Debit'},
          {k:'credit',l:'Credit'},{k:'balance',l:'Balance'}],
    rows:function(v){
      const out = [];
      const s = db.suppliers.find(x => x.supName === v.supplier);
      let bal = 0;
      if(s){
        bal = num(s.opening);
        out.push({ description:'Opening Balance', debit:'', credit:money(bal), balance:money(bal) });
      }
      db.payments
        .filter(p => p.supplier === v.supplier && inRange(p.date, v.from, v.to))
        .forEach(p => {
          bal -= num(p.amount);
          out.push({ description:p.particulars || 'Payment',
                     debit:money(p.amount), credit:'', balance:money(bal) });
        });
      return out;
    }
  }
};

  ],

  act:function(action, v, def){
    const st = formState[def.id] || (formState[def.id] = {});
    st._list = st._list || [];

    if(action === 'save' || action === 'add' || action === 'exit'){
      const it = db.items.find(i => String(i.barcode) === String(v.item));
      if(it && num(v.qty) > 0){
        const qty   = num(v.qty);
        const prate = num(it.prate);
        const gst   = num(it.gst);
        const amt   = prate * qty * (1 - gst/100);
        st._list.push({
          barcode: it.barcode, itemName: it.itemName, group: it.group,
          company: it.company, style: it.style, qty: qty, prate: prate,
          gst: gst, amount: amt.toFixed(2)

    if(action === 'save'){ go(def.id); return true; }

      st._list.forEach(l => db.received.push(Object.assign({}, l, {
        invoiceNo: v.invoiceNo, date: v.date, supplier: v.supplier

FORMS['bills'] = {
  title:'Bills', parent:'billing', bg:'beachfort',
  fields:[
    { n:'billNo',   l:'Bill No',    t:'number' },
    { n:'salesman', l:'Salesman',   t:'select', src:'salesmen', all:true },
    { n:'item',     l:'Item',       t:'select', src:'items', all:true },
    { n:'saleQty',  l:'Sale Qty',   t:'number' }
  ],
  buttons:[B.add, B.modify, B.save, B.print, B.cancel, B.hold, B.rehold, B.exit],
  act:function(action, v, def){
    const st = formState[def.id] || (formState[def.id] = {});
    st._list = st._list || [];
    if(!st.billNo) st.billNo = nextBillNo();

    function pushLine(){
      const it = db.items.find(i => String(i.barcode) === String(v.item));
      if(it && num(v.saleQty) > 0){
        const qty = num(v.saleQty), mrp = num(it.mrp), gst = num(it.gst);
        const amount = mrp * qty * (1 + gst/100);
        st._list.push({
          barcode: it.barcode, itemName: it.itemName, qty: qty,
          mrp: mrp, gst: gst, amount: amount.toFixed(2)
        });
      }
    }

    if(action === 'save' || action === 'add' || action === 'hold' || action === 'exit'){
      pushLine();
    }
    if(action === 'save'){ go(def.id); return true; }
    if(action === 'modify'){ go(def.id); return true; }
    if(action === 'print'){ window.print(); return true; }

    if(action === 'add'){
      ['item','saleQty'].forEach(k => delete st[k]);
      go(def.id);
      return true;
    }

    if(action === 'hold'){
      const total = st._list.reduce((a,l) => a + num(l.amount), 0);
      db.hold.push({ billNo: st.billNo, salesman: v.salesman, amount: total.toFixed(2), lines: st._list });
      persist('hold');
      delete formState[def.id];
      go(def.id);
      return true;
    }

    if(action === 'rehold'){
      const h = db.hold[db.hold.length - 1];
      if(h){
        st._list = h.lines.slice();
        st.billNo = h.billNo;
        st.salesman = h.salesman;
        st._shown = true;
      }
      go(def.id);
      return true;
    }

    if(action === 'cancel'){
      delete formState[def.id];
      go(def.parent);
      return true;
    }

    if(action === 'exit'){
      if(st._list.length){
        const total = st._list.reduce((a,l) => a + num(l.amount), 0);
        db.bills.push({
          billNo: v.billNo || st.billNo, date: today(), salesman: v.salesman,
          lines: st._list, amount: total.toFixed(2)
        });
        persist('bills');
      }
      delete formState[def.id];
      go(def.parent);
      return true;
    }
    return false;
  },
  table:{
    auto:true,
    cols:[{k:'barcode',l:'Bar Code'},{k:'itemName',l:'Item Name'},{k:'qty',l:'Qty'},
          {k:'mrp',l:'MRP'},{k:'gst',l:'GST'},{k:'amount',l:'Amount (\u20B9)'}],
    rows:function(v, def){
      return (formState[def.id] && formState[def.id]._list) || [];
    }
  }
};

          {k:'closingQty',l:'Closing Qty'}],
    rows:function(v){
      const map = {};
      const get = g => (map[g] = map[g] || { group:g, openingQty:0, receivingQty:0, saleQty:0, closingQty:0 });

      db.bills.forEach(b => {
        if(!inRange(b.date, v.from, v.to)) return;
        (b.lines || []).forEach(l => {
          const it = db.items.find(i => String(i.barcode) === String(l.barcode));
          const g = (it && it.group) || 'General';
          if(v.group && g !== v.group) return;
          get(g).saleQty += num(l.qty);
        });
      });

      return Object.values(map).map(r => {
        r.closingQty = r.openingQty + r.receivingQty - r.saleQty;
        return r;
      });
    }
  }
};

/* ------------------------- LOGIN ENTRY ---------------------------- */
FORMS['login-entry'] = {
  title:'Login Entry', parent:'options', bg:'library', admin:true,
  fields:[
    { n:'username', l:'User Name',       t:'text' },
    { n:'password', l:'Password',        t:'password' },
    { n:'retype',   l:'Re-type Password',t:'password' }
  ],
  buttons:[B.ok, B.cancel, B.exit],
  act:function(action, v, def){
    if(action === 'ok'){
      if(v.username && v.password && v.password === v.retype){
        db.logins.push({ username:v.username, password:v.password });
        persist('logins');
        delete formState[def.id];
        go(def.id);
      }
      return true;
    }
    if(action === 'cancel'){
      delete formState[def.id];
      go('options');
      return true;
    }
    if(action === 'exit'){
      if(v.username && v.password && v.password === v.retype){
        db.logins.push({ username:v.username, password:v.password });
        persist('logins');
      }
      delete formState[def.id];
      go('options');
      return true;
    }
    return false;
  }
};

/* ==================================================================
   11. ROUTER
   ================================================================== */
function go(id){
  if(PAGES[id]) return renderPage(id);
  if(FORMS[id]) return renderForm(id);
  return renderPage('s6');
}
function openForm(id){
  delete formState[id];
  go(id);
}

/* ==================================================================
   12. PAGE RENDERER
   ================================================================== */
function renderPage(id){
  const def = PAGES[id];
  const s = screenShell(def.bg, def.title, def.parent);
  const c = s._content;

  const wrap = el('div', 'center-wrap');
  const grid = el('div', 'tile-grid');

  def.buttons.forEach(function(b){
    const locked = b.admin && !state.isAdmin;
    const t = el('button', 'tile' + (locked ? ' disabled' : ''));
    t.type = 'button';
    if(locked) t.disabled = true;
    t.innerHTML = '<span class="tile-ico">' + b.ico + '</span>' +
                  '<span class="tile-lbl">' + esc(b.l) + '</span>';
    if(!locked){
      t.onclick = function(){
        if(b.act === 'exitapp') return exitApp();
        if(b.form) return openForm(b.form);
        if(b.to)   return go(b.to);
      };
    }
    grid.appendChild(t);
  });

  wrap.appendChild(grid);
  c.appendChild(wrap);
  c.appendChild(footer());
  mount(s);
}

/* ==================================================================
   13. FORM RENDERER
   ================================================================== */
function renderForm(id){
  const def = FORMS[id];
  def.id = id;

  if(def.admin && !state.isAdmin){ go(def.parent); return; }

  const s = screenShell(def.bg, def.title, def.parent);
  const c = s._content;

  const st = formState[id] || (formState[id] = {});

  /* ---- form card ---- */
  const card = el('div', 'card-glass');
  const formEl = el('form');
  formEl.setAttribute('autocomplete','off');
  formEl.addEventListener('submit', e => e.preventDefault());

  if(def.fields && def.fields.length){
    const grid = el('div', 'form-grid');
    def.fields.forEach(function(f){
      const wrapF = el('div', 'field' + (f.full ? ' full' : ''));
      const lbl = el('label', null, esc(f.l));
      wrapF.appendChild(lbl);

      let inp;
      if(f.t === 'select'){
        inp = document.createElement('select');
        inp.className = 'inp';
        if(f.all) inp.appendChild(new Option('\u2014 All \u2014', ''));
        sourceOptions(f.src).forEach(function(o){
          inp.appendChild(new Option(o.l, o.v));
        });
        if(st[f.n] != null && st[f.n] !== '') inp.value = st[f.n];
      }else{
        inp = document.createElement('input');
        inp.className = 'inp';
        inp.type = f.t || 'text';
        if(f.ph) inp.placeholder = f.ph;
        if(st[f.n] != null) inp.value = st[f.n];
      }
      inp.name = f.n;

      inp.addEventListener('change', function(){
        const v = readForm(formEl);
        formState[def.id] = Object.assign({}, formState[def.id] || {}, v);
        if(f.onchange) f.onchange(def, formEl);
        else if(def.rerender) go(def.id);
      });

      wrapF.appendChild(inp);
      grid.appendChild(wrapF);
    });
    formEl.appendChild(grid);
  }

  /* ---- button bar ---- */
  const bar = el('div', 'btn-bar');
  def.buttons.forEach(function(b){
    const locked = b.admin && !state.isAdmin;
    const btn = el('button', 'btn-x ' + b.c + (locked ? ' disabled' : ''), esc(b.l));
    btn.type = 'button';
    if(locked) btn.disabled = true;
    else btn.onclick = function(){ doAction(b.a, def, formEl); };
    bar.appendChild(btn);
  });
  formEl.appendChild(bar);
  card.appendChild(formEl);
  c.appendChild(card);

  /* ---- table card ---- */
  if(def.table){
    const show = def.table.auto || st._shown;
    if(show){
      const tcard = el('div', 'card-glass');
      renderTable(def, readForm(formEl), tcard);
      c.appendChild(tcard);
    }
  }

  c.appendChild(footer());
  mount(s);
}

/* ==================================================================
   14. TABLE RENDERER
   ================================================================== */
function renderTable(def, values, container){
  const t = def.table;
  let rows = [];
  try{ rows = t.rows ? (t.rows(values, def) || []) : []; }catch(e){ rows = []; }

  const wrap = el('div', 'table-wrap');

  if(!rows.length){
    wrap.appendChild(el('div', 'empty', 'No records found.'));
    container.appendChild(wrap);
    return;
  }

  const sc  = el('div', 'table-scroll');
  const tbl = el('table', 'tbl');
  const thead = el('thead');
  const htr = el('tr');
  t.cols.forEach(col => htr.appendChild(el('th', null, esc(col.l))));
  thead.appendChild(htr);
  tbl.appendChild(thead);

  const tb = el('tbody');
  rows.forEach(function(r){
    const tr = el('tr');
    t.cols.forEach(function(col){
      let val = r[col.k];
      tr.appendChild(el('td', null, esc(val == null ? '' : val)));
    });
    if(t.click) tr.onclick = function(){ t.click(r, def); };
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  sc.appendChild(tbl);
  wrap.appendChild(sc);
  container.appendChild(wrap);
}

/* ==================================================================
   15. FORM READ / ACTION ENGINE
   ================================================================== */
function readForm(formEl){
  const o = {};
  formEl.querySelectorAll('input,select,textarea').forEach(function(inp){
    if(inp.name) o[inp.name] = inp.value;
  });
  return o;
}

function doAction(action, def, formEl){
  const v = readForm(formEl);
  formState[def.id] = Object.assign({}, formState[def.id] || {}, v);

  if(['search','save','show','add','modify','ok','hold','rehold'].indexOf(action) >= 0){
    formState[def.id]._shown = true;
  }

  if(def.act && def.act(action, v, def, formEl)) return;
  defaultAction(action, def, v);
}

function defaultAction(action, def, v){
  switch(action){
    case 'more':
      if(def.store && !isBlank(v)) saveRecord(def, v);
      delete formState[def.id];
      go(def.id);
      return;

    case 'save':
      if(def.store && !isBlank(v)) saveRecord(def, v);
      go(def.id);
      return;

    case 'modify':
      if(def.store) replaceRecord(def, v);
      delete formState[def.id];
      go(def.parent);
      return;

    case 'cancel':
      delete formState[def.id];
      go(def.parent);
      return;

    case 'exit':
      if(def.saveOnExit && def.store && !isBlank(v)) saveRecord(def, v);
      delete formState[def.id];
      go(def.parent);
      return;

    case 'print':
      window.print();
      return;

    case 'search':
    case 'show':
    case 'add':
    case 'ok':
      go(def.id);
      return;

    default:
      go(def.id);
  }
}

function saveRecord(def, v){
  const rec = {};
  (def.fields || []).forEach(function(f){
    if(f.n.charAt(0) === '_') return;
    rec[f.n] = v[f.n];
  });
  rec._id = uid();
  db[def.store].push(rec);
  persist(def.store);
}

function replaceRecord(def, v){
  const st = formState[def.id] || {};
  const kf = def.keyField || 'supName';
  const key = (st._pick != null && st._pick !== '') ? st._pick : v[kf];
  const list = db[def.store];

  const rec = {};
  (def.fields || []).forEach(function(f){
    if(f.n.charAt(0) === '_') return;
    rec[f.n] = v[f.n];
  });

  const i = list.findIndex(r => String(r[kf]) === String(key));
  if(i >= 0){ rec._id = list[i]._id; list[i] = rec; }
  else list.push(rec);
  persist(def.store);
}

  renderWelcome();
})();
